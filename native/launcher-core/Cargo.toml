[package]
name = "tool-launcher-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
license = "LGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
