plugins { id 'base' }

def manifest = new groovy.json.JsonSlurper().parse(file('upstream.json'), 'UTF-8')
def pythonExecutable = rootProject.providers.gradleProperty('pythonExecutable').orElse('python')
ext.forkArchiveFor = { String target ->
    rootProject.layout.buildDirectory.file("components/viafabricplus/${target}/ToolVisualsProtocols-${manifest.targets[target].version}+toolvisuals.${manifest.revision}.jar")
}
ext.forkCompileArchiveFor = { String target -> rootProject.layout.buildDirectory.file("components/viafabricplus/${target}/compile-api.jar") }
ext.forkTaskFor = { String target -> tasks.named('fork' + target.replace('.', '')) }

manifest.targets.each { String target, profile ->
    tasks.register('prepare' + target.replace('.', ''), Exec) {
        workingDir rootProject.projectDir
        commandLine pythonExecutable.get(), file('build.py'), target, '--acquire'
    }
    tasks.register('fork' + target.replace('.', ''), Exec) {
        workingDir rootProject.projectDir
        commandLine pythonExecutable.get(), file('build.py'), target, '--build'
        inputs.files(fileTree('src'), 'upstream.json', 'libraries.json', 'toolchain.json', 'game-inputs.json', 'NOTICE', 'COPYING', 'ATTRIBUTION', 'build.gradle', 'build.py', rootProject.file('versions/targets.json'),
                rootProject.file('build-tools/protocol_fork.py'), rootProject.file('build-tools/protocol_source.py'), rootProject.file('build-tools/protocol_mappings.py'), rootProject.file('build-tools/dependencies.py'))
        outputs.files(forkArchiveFor(target), forkCompileArchiveFor(target))
    }
}
